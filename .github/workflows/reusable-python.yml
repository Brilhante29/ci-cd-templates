name: reusable-python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository-relative Python project directory
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.13
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Type check
        run: python -m mypy src
      - name: Test with coverage
        run: python -m coverage run -m unittest discover -s tests -v && python -m coverage report --fail-under=90
