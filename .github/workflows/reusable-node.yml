name: reusable-node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository-relative Node project directory
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.13.0
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
