id: 24
name: ci-cd-templates
program:
  id: delivery-observability-infra
  narrative_fit: Reusable, auditable CI guardrails turn workflow quality into a measurable delivery capability.
  shared_assets:
    - deterministic GitHub Actions scan contract
    - Dockerized release validation path
status: benchmarked
claim: validate GitHub Actions workflows before merge with deterministic local policies and optional external analyzers
stack:
  - Python 3.10+
  - PyYAML
  - actionlint 1.7.12
  - zizmor 1.26.1
  - Docker
  - GitHub Actions
language_profile:
  primary: python
  secondary:
    - yaml
    - docker
  reason: Python provides a typed, testable CLI while YAML and Docker remain explicit integration boundaries.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: delivery-observability-infra
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-only; no cloud dependency
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: policy and benchmark logic do not depend on the CLI, Docker, or external analyzer processes
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: one pipeline and one JSON contract prove the claim; no service or database is required
    testability_rule: scanners run against local fixtures without Docker, credentials, network, or GitHub access
    rejected_overengineering:
      - distributed service orchestration
      - cloud-hosted policy database
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: external analyzers are subprocess adapters and require no cloud SDK or credentials
    config_switch: CI_GUARDRAILS_EXTERNAL_TOOLS=0|1
    unsupported_behaviors: []
  database: none
  runtime: Python CLI in a slim Docker image
  library_policy: PyYAML handles YAML nodes and source locations; standard library modules handle CLI, timing, JSON, and subprocess isolation.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Rust CLI
      reason: strong binary distribution, but Python is faster to iterate for policy fixtures and portfolio reuse.
    - option: action-only composite workflow
      reason: cannot run the same deterministic scan locally without GitHub Actions.
architecture:
  style: pipeline
  reason: A scan is a naturally ordered pipeline from files to parsed documents, policies, optional analyzers, and a stable report.
  problem_forces:
    domain_complexity: medium
    integration_pressure: medium
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: high
    throughput_or_async: low
    independent_deployability: medium
  dependency_rule: models and policies depend only on typed values; scanner composes policies and tool adapters; CLI and Docker depend inward.
  boundaries:
    - yaml_loader owns safe parsing and source locations
    - policies owns repository-local guardrails
    - tools owns actionlint and zizmor subprocess adapters
    - scanner owns composition and stable ordering
    - benchmark owns timing and environment evidence
    - validation owns the repository release gate
  rejected_alternatives:
    - style: microservices
      reason: adds deployment and network failure modes to a local static-analysis problem.
    - style: clean-architecture service
      reason: a single-process pipeline has no transport or persistence boundary worth introducing.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_table
    - architecture_diagram
    - command_contract
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: scan_time_ms
  unit: milliseconds
  command: python -m ci_guardrails benchmark --fixtures benchmarks/fixtures --runs 3 --warmup 1
  result_path: benchmarks/results/guardrails-baseline.json
  publication_result_path: benchmarks/publication/guardrails-baseline-v2.json
  evidence_status: current
release:
  docker: Dockerfile with pinned actionlint and zizmor versions
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
