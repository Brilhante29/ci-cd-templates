schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: ci-cd-templates (#24)
  Source of truth:
    - Use `.portfolio/` as the local snapshot of portfolio-reuse-kit.
    - Use `project.yaml` for the public project contract.
    - Use `sdd/` and `openspec/artifacts/` for the implementation record.
  Core rules:
    - Prove the workflow guardrail claim with scan time and findings JSON.
    - Use the delivery-observability-infra component pack.
    - Keep policy and benchmark code independent from transport and infrastructure.
    - Prefer local-first execution and no credentials.
rules:
  reference-reuse:
    - Prioritize local skills and `.portfolio/`; external tools remain attributed references.
  intent:
    - Keep the claim measurable and README-ready.
  portfolio-impact:
    - Explain how the scan contract strengthens delivery observability.
  architecture-record:
    - Include dependency direction, SOLID, KISS, YAGNI, and testability evidence.
  component-pack:
    - Use the delivery-observability-infra pack and reject cloud-only defaults.
  reuse-delta:
    - Record benchmark and finding-contract improvements in the reuse review.
  benchmark-proof:
    - Include metric, unit, command, fixtures, JSON path, digest, and environment.
  verification:
    - Verify tests, strict validation, Docker, CI, benchmark JSON, README, and references.
